<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Karl X</title>
<style>
  :root {
    --bg: #0a0a0c; --surface: #16161a; --surface-2: #1c1c21; --surface-hover: #232329;
    --border: #29292f; --text-primary: #f4f4f5; --text-secondary: #9a9aa3; --text-tertiary: #6a6a72;
    --accent: #7c5cff; --accent-2: #35d6c4; --accent-soft: rgba(124,92,255,0.15);
    --warn-bg: rgba(240,177,0,0.12); --warn-text: #f0b100; --warn-border: rgba(240,177,0,0.28);
    --success: #35d68a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 348px; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px;
    background-image: radial-gradient(120% 90px at 50% 0%, rgba(124,92,255,0.16), transparent 70%);
    background-repeat: no-repeat;
  }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 9px; padding: 14px 16px 10px; }
  .brand-mark { width: 24px; height: 24px; border-radius: 7px; background: #000; overflow: hidden; flex-shrink: 0; }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; }
  .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .status-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--success); flex-shrink: 0; box-shadow: 0 0 6px var(--success); }
  .status-dot.offline { background: var(--text-tertiary); box-shadow: none; }
  .header-spacer { flex: 1; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-secondary); display: flex;
    align-items: center; justify-content: center; cursor: pointer; font-size: 12px;
  }
  .icon-btn:hover { background: var(--surface-hover); }

  /* ---------- segmented switcher ---------- */
  .segmented {
    display: flex; gap: 2px; margin: 0 16px 12px; padding: 3px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .segment {
    flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
  }
  .segment.active { background: var(--surface-2); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }

  /* ---------- duplicate banner ---------- */
  .banner {
    margin: 0 16px 12px; padding: 9px 11px; border-radius: 8px;
    background: var(--warn-bg); border: 1px solid var(--warn-border);
    color: var(--warn-text); font-size: 12px; display: flex; align-items: center; gap: 7px;
  }
  .banner .close-x { margin-left: auto; cursor: pointer; opacity: 0.7; font-size: 13px; }
  .banner .close-x:hover { opacity: 1; }

  /* ---------- select row ---------- */
  .select-row { display: flex; align-items: center; padding: 0 16px 8px; font-size: 12px; }
  .select-row .link-btn { color: var(--accent); cursor: pointer; font-weight: 600; }
  .select-row .link-btn:hover { color: #9481ff; }
  .select-row .sep { color: var(--text-tertiary); margin: 0 7px; }
  .select-row .count { margin-left: auto; color: var(--text-secondary); }

  /* ---------- scroll area ---------- */
  .tab-list { max-height: 260px; overflow-y: auto; padding: 0 16px 6px; display: flex; flex-direction: column; gap: 8px; }

  .group-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    border-left-width: 3px; border-left-style: solid;
  }
  .group-header { display: flex; align-items: center; gap: 9px; padding: 9px 11px; cursor: pointer; user-select: none; }
  .group-header:hover { background: var(--surface-hover); }
  .group-name { font-weight: 700; flex: 1; font-size: 12.5px; }
  .group-count { color: var(--text-tertiary); font-size: 11.5px; }
  .chevron { color: var(--text-tertiary); font-size: 10px; transition: transform .15s ease; }
  .chevron.collapsed { transform: rotate(-90deg); }

  .tab-item { display: flex; align-items: center; gap: 9px; padding: 6px 11px 6px 30px; }
  .tab-item:hover { background: var(--surface-hover); }
  .tab-favicon { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; background: var(--border); }
  .tab-title { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-item.checked .tab-title { color: var(--text-primary); }

  .checkbox {
    width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--border);
    background: var(--surface-2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after { content: "✓"; color: white; font-size: 9px; font-weight: 700; }

  /* ---------- footer: gradient CTA buttons with shortcut hints ---------- */
  .footer-controls { padding: 14px 16px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 9px; }
  .export-title-input {
    width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-primary); font-size: 12px; outline: none;
  }
  .export-title-input:focus { border-color: var(--accent); }
  .export-title-input::placeholder { color: var(--text-tertiary); }

  .btn-row { display: flex; gap: 8px; }
  .cta-btn {
    flex: 1; border: none; border-radius: 10px; cursor: pointer; padding: 12px 10px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    color: white; font-weight: 700; font-size: 12.5px; position: relative; overflow: hidden;
  }
  .cta-btn .cta-icon { font-size: 13px; }
  .cta-btn.primary { background: linear-gradient(135deg, var(--accent), #5b3df0); }
  .cta-btn.primary:hover { filter: brightness(1.08); }
  .cta-btn.secondary { background: linear-gradient(135deg, #ff7a59, #ff4d6d); }
  .cta-btn.secondary:hover { filter: brightness(1.08); }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 16px; font-size: 11px; color: var(--text-tertiary); border-top: 1px solid var(--border);
  }
  .status-bar .backend-status { display: flex; align-items: center; gap: 6px; }
</style>
</head>

  function hexToRgba(hex, alpha) {
    const clean = hex.replace('#', '');
    const bigint = parseInt(clean, 16);
    const r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function totalTabs() { return groups.reduce((sum, g) => sum + g.tabs.length, 0); }
  function updateCount() {
    const checkedCount = [...checkedState.values()].filter(Boolean).length;
    selectedCountEl.textContent = `${checkedCount} / ${totalTabs()} tabs`;
  }

  function buildGroup(group) {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.style.borderLeftColor = group.color;
    card.style.background = `linear-gradient(90deg, ${hexToRgba(group.color, 0.10)}, var(--surface) 45%)`;

    const header = document.createElement('div');
    header.className = 'group-header';

    const groupCheckbox = document.createElement('div');
    groupCheckbox.className = 'checkbox checked';

    const name = document.createElement('div');
    name.className = 'group-name';
    name.textContent = group.name;
    name.style.color = group.color;

    const count = document.createElement('div');
    count.className = 'group-count';
    count.textContent = `(${group.tabs.length})`;

    const chevron = document.createElement('div');
    chevron.className = 'chevron';
    chevron.textContent = '▾';

    header.appendChild(groupCheckbox);
    header.appendChild(name);
    header.appendChild(count);
    header.appendChild(chevron);

    const body = document.createElement('div');
    group.tabs.forEach((tab, i) => {
      const key = `${group.id}-${i}`;
      checkedState.set(key, true);

      const item = document.createElement('div');
      item.className = 'tab-item checked';

      const cb = document.createElement('div');
      cb.className = 'checkbox checked';
      cb.addEventListener('click', (e) => {
        e.stopPropagation();
        const nowChecked = !checkedState.get(key);
        checkedState.set(key, nowChecked);
        cb.classList.toggle('checked', nowChecked);
        item.classList.toggle('checked', nowChecked);
        syncGroupCheckbox();
        updateCount();
      });

      const favicon = document.createElement('div');
      favicon.className = 'tab-favicon';

      const title = document.createElement('div');
      title.className = 'tab-title';
      title.textContent = tab.title;

      item.appendChild(cb);
      item.appendChild(favicon);
      item.appendChild(title);
      body.appendChild(item);
    });

    function syncGroupCheckbox() {
      const allChecked = group.tabs.every((_, i) => checkedState.get(`${group.id}-${i}`));
      groupCheckbox.classList.toggle('checked', allChecked);
    }

    groupCheckbox.addEventListener('click', () => {
      const allChecked = group.tabs.every((_, i) => checkedState.get(`${group.id}-${i}`));
      const newState = !allChecked;
      group.tabs.forEach((_, i) => checkedState.set(`${group.id}-${i}`, newState));
      [...body.children].forEach(item => {
        item.classList.toggle('checked', newState);
        item.querySelector('.checkbox').classList.toggle('checked', newState);
      });
      groupCheckbox.classList.toggle('checked', newState);
      updateCount();
    });

    let collapsed = false;
    header.addEventListener('click', (e) => {
      if (e.target === groupCheckbox) return;
      collapsed = !collapsed;
      body.style.display = collapsed ? 'none' : '';
      chevron.classList.toggle('collapsed', collapsed);
    });

    card.appendChild(header);
    card.appendChild(body);
    return card;
  }

  groups.forEach(g => tabList.appendChild(buildGroup(g)));
  updateCount();

  selectAllBtn.addEventListener('click', () => {
    checkedState.forEach((_, key) => checkedState.set(key, true));
    document.querySelectorAll('.checkbox').forEach(cb => cb.classList.add('checked'));
    document.querySelectorAll('.tab-item').forEach(item => item.classList.add('checked'));
    updateCount();
  });
  deselectAllBtn.addEventListener('click', () => {
    checkedState.forEach((_, key) => checkedState.set(key, false));
    document.querySelectorAll('.checkbox').forEach(cb => cb.classList.remove('checked'));
    document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('checked'));
    updateCount();
  });

  dupClose.addEventListener('click', () => { dupBanner.style.display = 'none'; });

  segments.forEach(seg => {
    seg.addEventListener('click', () => {
      segments.forEach(s => s.classList.remove('active'));
      seg.classList.add('active');
      // "All Tabs" mode would flatten groups into a single list in the real extension —
      // left as a visual affordance here since this file uses static sample data.
    });
  });

  exportBtn.addEventListener('click', () => {
    const checkedCount = [...checkedState.values()].filter(Boolean).length;
    alert(`Would export ${checkedCount} tab(s) to HTML.`);
  });
})();
</script>

</body>
</html>
