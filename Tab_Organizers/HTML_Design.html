<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karl X — Saved Tabs</title>
<style>
  :root[data-theme="dark"] {
    --bg: #0f0f11; --sidebar-bg: #0f0f11; --surface: #1a1a1d; --surface-hover: #232327;
    --border: #2a2a2e; --text-primary: #f1f1f3; --text-secondary: #9c9ca3; --text-tertiary: #6b6b72;
    --accent: #7c5cff; --accent-hover: #8f72ff; --accent-soft: rgba(124,92,255,0.16);
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --sidebar-bg: #ffffff; --surface: #ffffff; --surface-hover: #f2f2f5;
    --border: #e6e6ea; --text-primary: #17171a; --text-secondary: #6b6b72; --text-tertiary: #9c9ca3;
    --accent: #6947ff; --accent-hover: #5936e6; --accent-soft: rgba(105,71,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  body { display: flex; }
  a { text-decoration: none; color: inherit; }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--sidebar-bg);
    border-right: 1px solid var(--border); padding: 16px 12px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    transition: width .18s ease, padding .18s ease; display: flex; flex-direction: column;
  }
  .sidebar.collapsed { width: 72px; padding: 16px 10px; }
  .sidebar.collapsed .label, .sidebar.collapsed .section-title, .sidebar.collapsed .brand-name, .sidebar.collapsed .sidebar-badge { display: none; }
  .sidebar.collapsed .brand { justify-content: center; padding: 4px 0 20px; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 9px 0; }

  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: #000; display: flex; align-items: center; justify-content: center;
    overflow: hidden; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }

  .nav-item {
    display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 8px;
    color: var(--text-secondary); font-size: 14px; cursor: pointer; white-space: nowrap;
    border: none; background: transparent; width: 100%; text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:hover { background: var(--surface-hover); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .sidebar-badge { margin-left: auto; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--surface-hover); color: var(--text-secondary); font-weight: 600; }

  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); padding: 16px 10px 6px; font-weight: 700;
  }

  /* ---------- main column ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-x: hidden; }

  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-secondary); flex-shrink: 0; font-size: 15px;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
  .search-wrap { flex: 1; min-width: 200px; max-width: 560px; position: relative; }
  .search-bar {
    width: 100%; padding: 11px 16px 11px 40px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-primary); font-size: 14px; outline: none;
    transition: border-color 0.15s;
  }
  .search-bar:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; font-size: 14px; }
  .header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .btn-primary {
    background: var(--accent); color: #ffffff; border: none;
    padding: 10px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13.5px;
    white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  /* ---------- category pills ---------- */
  .pill-row {
    display: flex; gap: 8px; padding: 14px 28px; overflow-x: auto;
    border-bottom: 1px solid var(--border); scrollbar-width: none; flex-shrink: 0;
  }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill {
    padding: 7px 16px; border-radius: 8px; background: var(--surface); border: 1px solid transparent;
    color: var(--text-primary); font-size: 13.5px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: background 0.12s, color 0.12s, border-color 0.12s; display: inline-flex; align-items: center; gap: 6px;
  }
  .pill:hover { background: var(--surface-hover); }
  .pill.active { background: var(--text-primary); color: var(--bg); font-weight: 600; }
  .pill-important { color: #f59e0b; }
  .pill-important.active { background: #f59e0b; color: #000; font-weight: 700; }
  .pill-urgent { color: #ef4444; }
  .pill-urgent.active { background: #ef4444; color: #fff; font-weight: 700; }

  /* ---------- grid ---------- */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px 16px; padding: 24px 28px; width: 100%;
  }
  @media (max-width: 480px) {
    .sidebar { display: none; }
    .grid { grid-template-columns: 1fr; padding: 16px; gap: 20px; }
  }

  .card-container { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .card { display: flex; flex-direction: column; cursor: pointer; text-decoration: none; color: inherit; min-width: 0; border-radius: 12px; }
  .thumb-wrap {
    aspect-ratio: 16/9; width: 100%; border-radius: 12px; overflow: hidden;
    background: var(--border); position: relative; margin-bottom: 10px;
  }
  .thumb-wrap img.cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-fallback {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; color: rgba(255,255,255,0.92);
  }
  .thumb-fallback .favicon { width: 30px; height: 30px; border-radius: 7px; background: rgba(255,255,255,0.22); }
  .thumb-fallback .domain-label { font-size: 12px; opacity: 0.9; font-weight: 600; }

  .thumb-badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; z-index: 5; }
  .thumb-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; backdrop-filter: blur(6px); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .badge-star { background: rgba(245,158,11,0.92); color: #000; }
  .badge-flame { background: rgba(239,68,68,0.92); color: #fff; }

  .card-row { display: flex; gap: 10px; min-width: 0; position: relative; align-items: flex-start; }
  .avatar {
    width: 34px; height: 34px; border-radius: 999px; flex-shrink: 0; margin-top: 2px;
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-secondary); overflow: hidden; border: 1px solid var(--border);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .card-text { min-width: 0; flex: 1; overflow: hidden; }
  .card-title {
    font-size: 14.5px; font-weight: 600; line-height: 1.35; color: var(--text-primary);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 4px; word-break: break-word;
  }
  .card-meta { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .card-badges-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-important { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
  .badge-urgent { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .topic-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }

  /* 3-dots YouTube Style Menu */
  .dots-menu-wrapper { position: relative; flex-shrink: 0; margin-top: -2px; margin-right: -4px; z-index: 20; }
  .dots-btn {
    width: 28px; height: 28px; border-radius: 50%; background: transparent; border: none;
    color: var(--text-secondary); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; font-weight: 700; line-height: 1; transition: background 0.15s ease, color 0.15s ease;
    opacity: 0.6;
  }
  .card:hover .dots-btn, .card-container:hover .dots-btn, .dots-btn.active { opacity: 1; color: var(--text-primary); }
  .dots-btn:hover, .dots-btn.active { background: var(--surface-hover); }

  .dots-dropdown {
    position: absolute; top: 100%; right: 0; z-index: 100; min-width: 180px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); display: flex; flex-direction: column; gap: 2px;
    animation: dropdownFade 0.15s ease-out;
  }
  @keyframes dropdownFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .dropdown-item {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px;
    border-radius: 8px; border: none; background: transparent; color: var(--text-primary);
    font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; transition: background 0.12s, color 0.12s;
  }
  .dropdown-item:hover { background: var(--surface-hover); }
  .dropdown-item .item-icon { font-size: 14px; width: 16px; text-align: center; display: flex; align-items: center; justify-content: center; }
  .dropdown-item-danger { color: #ff5252; }
  .dropdown-item-danger:hover { background: rgba(255,82,82,0.12); color: #ff5252; }
  .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); grid-column: 1 / -1; }
  .empty-state button { margin-top: 12px; background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px; text-decoration: underline; }

  footer { text-align: center; padding: 24px; color: var(--text-tertiary); font-size: 12px; margin-top: auto; }
</style>
</head>

    <span class="label">Urgent</span>
    <span class="sidebar-badge" id="side-count-urgent">0</span>
  </div>

  <div class="section-title">Tools</div>
  <div class="nav-item" id="nav-time">
    <span class="nav-icon">◔</span>
    <span class="label">Time Spent</span>
  </div>
  <div class="nav-item" id="nav-brain">
    <span class="nav-icon">✦</span>
    <span class="label">Ask Karl</span>
  </div>
  <div class="nav-item" id="nav-graph">
    <span class="nav-icon">🕸️</span>
    <span class="label">Knowledge Graph</span>
  </div>
  <div class="nav-item" id="nav-settings">
    <span class="nav-icon">⚙️</span>
    <span class="label">Settings</span>
  </div>

  <div class="section-title">Topics</div>
  <div id="topic-nav"></div>
</aside>

<div class="main">
  <header>
    <button class="icon-btn" id="sidebar-toggle" title="Toggle Sidebar">☰</button>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-bar" id="search" placeholder="Search your saved tabs...  (press /)" />
    </div>
    <div class="header-right">
      <button class="btn-primary" id="open-all">Open All</button>
      <button class="icon-btn" id="theme-toggle" title="Switch theme">◐</button>
    </div>
  </header>

  <div class="pill-row" id="pill-row"></div>
  <div class="grid" id="grid"></div>
  <footer id="footer"></footer>
</div>

<script id="tab-data" type="application/json">
[
  {"url":"https://www.youtube.com/watch?v=1","title":"Building an LLM from Scratch: Ep. 5 - Building the full GPT model","domain":"youtube.com","image":null,"topic":"AI/ML","savedAgo":"2 days ago","is_important":true},
  {"url":"https://www.youtube.com/watch?v=2","title":"llm 101 vizuara free camp - YouTube","domain":"youtube.com","image":null,"topic":"AI/ML","savedAgo":"2 days ago","is_urgent":true},
  {"url":"https://www.youtube.com/watch?v=3","title":"Large Language Models explained briefly","domain":"youtube.com","image":null,"topic":"AI/ML","savedAgo":"3 days ago"},
  {"url":"https://www.youtube.com/watch?v=4","title":"Stanford CME296 Diffusion & Large Vision Models | Spring 2026 | Lecture 8","domain":"youtube.com","image":null,"topic":"academics","savedAgo":"3 days ago"},
  {"url":"https://www.youtube.com/watch?v=5","title":"Stanford CME295 Transformers & LLMs | Autumn 2025 | Lecture 1","domain":"youtube.com","image":null,"topic":"academics","savedAgo":"4 days ago"},
  {"url":"https://www.youtube.com/watch?v=6","title":"Computer Vision from Scratch | New course launch | By MIT PhD","domain":"youtube.com","image":null,"topic":"design","savedAgo":"4 days ago"},
  {"url":"https://www.youtube.com/watch?v=7","title":"Lecture 1: Introduction to Diffusion Language Models","domain":"youtube.com","image":null,"topic":"academics","savedAgo":"5 days ago"},
  {"url":"https://www.youtube.com/watch?v=8","title":"Lecture 1 - Reasoning LLMs from Scratch - Series Introduction","domain":"youtube.com","image":null,"topic":"AI/ML","savedAgo":"5 days ago"},
  {"url":"https://github.com/example/repo","title":"An open-source toolkit for evaluating reasoning models","domain":"github.com","image":null,"topic":"programming","savedAgo":"1 day ago"}
]
</script>

<script>
(function () {
  const dataElement = document.getElementById('tab-data');
  const rawData = JSON.parse(dataElement ? dataElement.textContent : '[]');

  const userFlags = JSON.parse(localStorage.getItem('karlx-flags-mock') || '{}');
  const deletedUrls = new Set(JSON.parse(localStorage.getItem('karlx-deleted-mock') || '[]'));

  function extractYoutubeThumbnail(url) {
    if (!url) return null;
    const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
    return match ? `https://i.ytimg.com/vi/${match[1]}/hqdefault.jpg` : null;
  }

  const data = rawData
    .filter(p => !deletedUrls.has(p.url))
    .map(p => {
      const flags = userFlags[p.url] || {};
      return {
        url: p.url || '#',
        title: p.title || p.url || 'Untitled',
        domain: p.domain || (p.url ? (function(u){ try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return ''; } })(p.url) : ''),
        image: p.image || extractYoutubeThumbnail(p.url) || null,
        topic: (p.topic && !['general', 'other', 'uncategorized', 'none', 'unknown', ''].includes(p.topic.toLowerCase().trim())) ? p.topic : null,
        savedAgo: p.savedAgo || '',
        is_important: flags.is_important !== undefined ? flags.is_important : (!!p.is_important),
        is_urgent: flags.is_urgent !== undefined ? flags.is_urgent : (!!p.is_urgent)
      };
    });

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const openAllBtn = document.getElementById('open-all');
  const themeToggle = document.getElementById('theme-toggle');
  const pillRow = document.getElementById('pill-row');
  const topicNav = document.getElementById('topic-nav');
  const footer = document.getElementById('footer');
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebar-toggle');

  let activeFilter = { type: 'all', value: null };
  let currentVisible = data.slice();

  const savedTheme = localStorage.getItem('karlx-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('karlx-theme', next);
  });

  sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

  function saveFlags() {
    const map = {};
    data.forEach(p => {
      map[p.url] = { is_important: p.is_important, is_urgent: p.is_urgent };
    });
    localStorage.setItem('karlx-flags-mock', JSON.stringify(map));
  }

  function hashHue(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return Math.abs(hash) % 360;
  }
  function faviconUrl(domain) { return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`; }
  function initial(str) { return (str || '?').trim().charAt(0).toUpperCase(); }

  function updateSidebarCounts() {
    const impCount = data.filter(p => p.is_important).length;
    const urgCount = data.filter(p => p.is_urgent).length;
    const impEl = document.getElementById('side-count-important');
    const urgEl = document.getElementById('side-count-urgent');
    if (impEl) impEl.textContent = impCount;
    if (urgEl) urgEl.textContent = urgCount;
  }

  function buildCard(page) {
    const container = document.createElement('div');
    container.className = 'card-container';

    const card = document.createElement('a');
    card.className = 'card';
    card.href = page.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'thumb-wrap';

    function showFallback() {
      thumbWrap.innerHTML = '';
      const hue = hashHue(page.domain || page.url);
      const fallback = document.createElement('div');
      fallback.className = 'thumb-fallback';
      fallback.style.background = `linear-gradient(135deg, hsl(${hue},45%,28%), hsl(${(hue+40)%360},50%,16%))`;
      const favicon = document.createElement('img');
      favicon.className = 'favicon';
      favicon.src = faviconUrl(page.domain);
      favicon.alt = '';
      favicon.addEventListener('error', () => { favicon.style.display = 'none'; }, { once: true });
      const label = document.createElement('div');
      label.className = 'domain-label';
      label.textContent = page.domain || '';
      fallback.appendChild(favicon);
      fallback.appendChild(label);
      thumbWrap.appendChild(fallback);
    }

    if (page.image) {
      const img = document.createElement('img');
      img.className = 'cover';
      img.src = page.image;
      img.alt = page.title || '';
      img.loading = 'lazy';
      img.addEventListener('error', showFallback, { once: true });
      thumbWrap.appendChild(img);
    } else {
      showFallback();
    }

    const thumbBadges = document.createElement('div');
    thumbBadges.className = 'thumb-badges';
    if (page.is_important) {
      const star = document.createElement('span');
      star.className = 'thumb-badge badge-star';
      star.textContent = '★';
      thumbBadges.appendChild(star);
    }
    if (page.is_urgent) {
      const flame = document.createElement('span');
      flame.className = 'thumb-badge badge-flame';
      flame.textContent = '🔥';
      thumbBadges.appendChild(flame);
    }
    thumbWrap.appendChild(thumbBadges);

    const row = document.createElement('div');
    row.className = 'card-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    const avatarImg = document.createElement('img');
    avatarImg.src = faviconUrl(page.domain);
    avatarImg.alt = '';
    avatarImg.addEventListener('error', () => {
      avatar.innerHTML = '';
      avatar.textContent = initial(page.domain);
    }, { once: true });
    avatar.appendChild(avatarImg);

    const textCol = document.createElement('div');
    textCol.className = 'card-text';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = page.title || page.url;

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.textContent = `${page.domain || ''} · ${page.savedAgo || ''}`;

    const badgesRow = document.createElement('div');
    badgesRow.className = 'card-badges-row';
    if (page.is_important) {
      const imp = document.createElement('span');
      imp.className = 'badge badge-important';
      imp.textContent = '★ Important';
      badgesRow.appendChild(imp);
    }
    if (page.is_urgent) {
      const urg = document.createElement('span');
      urg.className = 'badge badge-urgent';
      urg.textContent = '🔥 Urgent';
      badgesRow.appendChild(urg);
    }
    if (page.topic) {
      const pill = document.createElement('span');
      pill.className = 'topic-pill';
      pill.textContent = `#${page.topic}`;
      badgesRow.appendChild(pill);
    }

    textCol.appendChild(title);
    textCol.appendChild(meta);
    if (badgesRow.childNodes.length > 0) textCol.appendChild(badgesRow);

    // 3-dots menu
    const menuWrap = document.createElement('div');
    menuWrap.className = 'dots-menu-wrapper';

    const dotsBtn = document.createElement('button');
    dotsBtn.className = 'dots-btn';
    dotsBtn.textContent = '⋮';
    dotsBtn.title = 'More actions';

    const dropdown = document.createElement('div');
    dropdown.className = 'dots-dropdown';
    dropdown.style.display = 'none';

    const impBtn = document.createElement('button');
    impBtn.className = 'dropdown-item';
    impBtn.innerHTML = `<span class="item-icon">${page.is_important ? '★' : '☆'}</span><span>${page.is_important ? 'Unmark Important' : 'Mark as Important'}</span>`;
    impBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      page.is_important = !page.is_important;
      saveFlags();
      updateSidebarCounts();
      buildPillsAndNav();
      applyFilters();
    });
    dropdown.appendChild(impBtn);

    const urgBtn = document.createElement('button');
    urgBtn.className = 'dropdown-item';
    urgBtn.innerHTML = `<span class="item-icon">${page.is_urgent ? '🔥' : '⚡'}</span><span>${page.is_urgent ? 'Unmark Urgent' : 'Mark as Urgent'}</span>`;
    urgBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      page.is_urgent = !page.is_urgent;
      saveFlags();
      updateSidebarCounts();
      buildPillsAndNav();
      applyFilters();
    });
    dropdown.appendChild(urgBtn);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'dropdown-item';
    copyBtn.innerHTML = `<span class="item-icon">📋</span><span>Copy Link</span>`;
    copyBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      navigator.clipboard.writeText(page.url);
      copyBtn.innerHTML = `<span class="item-icon">✓</span><span>Copied!</span>`;
      setTimeout(() => { dropdown.style.display = 'none'; }, 1000);
    });
    dropdown.appendChild(copyBtn);

    const divider = document.createElement('div');
    divider.className = 'dropdown-divider';
    dropdown.appendChild(divider);

    const delBtn = document.createElement('button');
    delBtn.className = 'dropdown-item dropdown-item-danger';
    delBtn.innerHTML = `<span class="item-icon">🗑️</span><span>Remove Tab</span>`;
    delBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      deletedUrls.add(page.url);
      localStorage.setItem('karlx-deleted-mock', JSON.stringify([...deletedUrls]));
      const idx = data.indexOf(page);
      if (idx !== -1) data.splice(idx, 1);
      updateSidebarCounts();
      buildPillsAndNav();
      applyFilters();
    });
    dropdown.appendChild(delBtn);

    dotsBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      const isOpen = dropdown.style.display === 'flex';
      document.querySelectorAll('.dots-dropdown').forEach(d => d.style.display = 'none');
      dropdown.style.display = isOpen ? 'none' : 'flex';
    });

    menuWrap.appendChild(dotsBtn);
    menuWrap.appendChild(dropdown);

    row.appendChild(avatar);
    row.appendChild(textCol);
    row.appendChild(menuWrap);

    card.appendChild(thumbWrap);
    card.appendChild(row);
    container.appendChild(card);

    return container;
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.dots-dropdown').forEach(d => d.style.display = 'none');
  });

  function render(items) {
    currentVisible = items;
    grid.innerHTML = '';
    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `No links match your search or filter.<br><button id="clear-search">Show all</button>`;
      grid.appendChild(empty);
      document.getElementById('clear-search').addEventListener('click', () => {
        search.value = '';
        activeFilter = { type: 'all', value: null };
        const allPill = pillRow.querySelector('.pill');
        if (allPill) setActive(allPill);
        applyFilters();
      });
    } else {
      items.forEach(page => grid.appendChild(buildCard(page)));
    }
    openAllBtn.textContent = `Open All (${items.length})`;
  }

  function applyFilters() {
    const q = search.value.trim().toLowerCase();
    let filtered = data;
    if (activeFilter.type === 'important') filtered = filtered.filter(p => p.is_important);
    else if (activeFilter.type === 'urgent') filtered = filtered.filter(p => p.is_urgent);
    else if (activeFilter.type === 'topic') filtered = filtered.filter(p => p.topic === activeFilter.value);
    else if (activeFilter.type === 'domain') filtered = filtered.filter(p => p.domain === activeFilter.value);

    if (q) {
      filtered = filtered.filter(p =>
        (p.title || '').toLowerCase().includes(q) ||
        (p.domain || '').toLowerCase().includes(q) ||
        (p.topic || '').toLowerCase().includes(q)
      );
    }
    render(filtered);
  }

  function setActive(el) {
    pillRow.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    if (el) el.classList.add('active');
  }

  function buildPillsAndNav() {
    pillRow.innerHTML = '';
    topicNav.innerHTML = '';

    const impCount = data.filter(p => p.is_important).length;
    const urgCount = data.filter(p => p.is_urgent).length;
    const topics = [...new Set(data.map(p => p.topic).filter(Boolean))];
    const domains = [...new Set(data.map(p => p.domain).filter(Boolean))];

    const allPill = document.createElement('button');
    allPill.className = `pill ${activeFilter.type === 'all' ? 'active' : ''}`;
    allPill.textContent = `All (${data.length})`;
    allPill.addEventListener('click', () => { activeFilter = { type: 'all', value: null }; setActive(allPill); applyFilters(); });
    pillRow.appendChild(allPill);

    const impPill = document.createElement('button');
    impPill.className = `pill pill-important ${activeFilter.type === 'important' ? 'active' : ''}`;
    impPill.textContent = `★ Important (${impCount})`;
    impPill.addEventListener('click', () => { activeFilter = { type: 'important', value: null }; setActive(impPill); applyFilters(); });
    pillRow.appendChild(impPill);

    const urgPill = document.createElement('button');
    urgPill.className = `pill pill-urgent ${activeFilter.type === 'urgent' ? 'active' : ''}`;
    urgPill.textContent = `🔥 Urgent (${urgCount})`;
    urgPill.addEventListener('click', () => { activeFilter = { type: 'urgent', value: null }; setActive(urgPill); applyFilters(); });
    pillRow.appendChild(urgPill);

    topics.forEach(topic => {
      const count = data.filter(p => p.topic === topic).length;
      const pill = document.createElement('button');
      pill.className = `pill ${activeFilter.type === 'topic' && activeFilter.value === topic ? 'active' : ''}`;
      pill.textContent = `#${topic} (${count})`;
      pill.addEventListener('click', () => { activeFilter = { type: 'topic', value: topic }; setActive(pill); applyFilters(); });
      pillRow.appendChild(pill);
    });

    domains.slice(0, 5).forEach(domain => {
      const pill = document.createElement('button');
      pill.className = `pill ${activeFilter.type === 'domain' && activeFilter.value === domain ? 'active' : ''}`;
      pill.textContent = domain;
      pill.addEventListener('click', () => { activeFilter = { type: 'domain', value: domain }; setActive(pill); applyFilters(); });
      pillRow.appendChild(pill);
    });

    topics.forEach(topic => {
      const count = data.filter(p => p.topic === topic).length;
      const item = document.createElement('div');
      item.className = 'nav-item';
      item.innerHTML = `<span class="nav-icon">#</span><span class="label">${topic} · ${count}</span>`;
      item.addEventListener('click', () => {
        activeFilter = { type: 'topic', value: topic };
        pillRow.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        applyFilters();
      });
      topicNav.appendChild(item);
    });
  }

  const navAll = document.getElementById('nav-all');
  const navLib = document.getElementById('nav-library');
  const navImp = document.getElementById('nav-important');
  const navUrg = document.getElementById('nav-urgent');

  if (navAll) navAll.addEventListener('click', () => {
    activeFilter = { type: 'all', value: null };
    const p = pillRow.querySelector('.pill');
    if (p) setActive(p);
    applyFilters();
  });
  if (navLib) navLib.addEventListener('click', () => {
    activeFilter = { type: 'all', value: null };
    const p = pillRow.querySelector('.pill');
    if (p) setActive(p);
    applyFilters();
  });
  if (navImp) navImp.addEventListener('click', () => {
    activeFilter = { type: 'important', value: null };
    const p = pillRow.querySelector('.pill-important');
    if (p) setActive(p);
    applyFilters();
  });
  if (navUrg) navUrg.addEventListener('click', () => {
    activeFilter = { type: 'urgent', value: null };
    const p = pillRow.querySelector('.pill-urgent');
    if (p) setActive(p);
    applyFilters();
  });

  openAllBtn.addEventListener('click', () => {
    if (currentVisible.length > 30 && !confirm(`Open ${currentVisible.length} tabs? This may slow your browser.`)) return;
    currentVisible.forEach((page, i) => setTimeout(() => window.open(page.url, '_blank'), i * 120));
  });

  search.addEventListener('input', applyFilters);
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  });

  const exportDate = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  footer.textContent = `Karl X · Generated ${exportDate} · ${data.length} links · Works fully offline, no tracking`;

  updateSidebarCounts();
  buildPillsAndNav();
  render(data);
})();
</script>

</body>
</html>
