  <div class="segmented">
    <div class="segment active" id="seg-library" data-mode="library">Library</div>
    <div class="segment" id="seg-group" data-mode="group">Group</div>
  </div>

  <!-- Group Subnav (Active in Group mode: Saved Groups vs Unsaved Groups + Add Group) -->
  <div class="group-subnav" id="group-subnav" style="display: none;">
    <div class="group-subtabs">
      <button class="group-subtab active" id="subtab-saved" data-sub="saved">
        <span>Saved</span>
        <span class="subtab-badge" id="badge-saved-groups">0</span>
      </button>
      <button class="group-subtab" id="subtab-unsaved" data-sub="unsaved">
        <span>Unsaved</span>
        <span class="subtab-badge" id="badge-unsaved-groups">0</span>
      </button>
    </div>
  </div>

  <!-- Smart Single Recovery Banner (Consolidated startup/closed window recovery) -->
  <div id="recovery-banner" class="closed-win-banner" style="display: none;">
    <div class="closed-win-top">
      <div class="closed-win-info">
        <span class="closed-win-icon" id="recovery-icon">✨</span>
        <span id="recovery-title" class="closed-win-title">Previous Session Ready</span>
        <span id="recovery-timer" class="closed-win-badge">5m left</span>
      </div>
      <span class="close-x" id="recovery-dismiss" title="Dismiss">✕</span>
    </div>
    <div class="closed-win-preview" id="recovery-preview">Restore tabs across windows</div>
    <div class="closed-win-actions">
      <button class="btn-restore-win" id="btn-recovery-action" title="Reincarnate tabs">
        <span id="recovery-action-text">✦ Reincarnate</span>
      </button>
      <button class="btn-history-win" id="btn-recovery-history" title="View session history">
        History
      </button>
    </div>
  </div>

  <!-- Terminator Alert Banner -->
  <div id="dup-banner" class="banner terminator-banner" style="display: none;">
    <div class="dup-banner-left">
      <span>⚠ <span id="dup-text">Clutter detected</span></span>
    </div>
    <div class="dup-banner-actions">
      <button class="btn-terminator" id="btn-terminator" title="Terminate empty new tabs, excess duplicate copies, and custom target tabs">Terminate</button>
      <span class="close-x" id="dup-close" title="Dismiss">✕</span>
    </div>
  </div>

  <!-- Progress Bar (Active during export) -->
  <div id="progress-container" class="progress-container" style="display: none;">
    <div class="progress-header">
      <span id="progress-status">Scraping tabs...</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
  </div>

  <!-- Select Controls Row -->
  <div class="select-row">
    <span class="link-btn" id="btn-select-all">Select All</span>
    <span class="sep">·</span>
    <span class="link-btn" id="btn-deselect-all">Deselect All</span>
    <span class="count" id="tab-counter-text"><span id="selected-count">0</span> / <span id="total-count">0</span> tabs</span>
  </div>

  <!-- Main Scrollable Tab Area -->
  <main id="main-content">
    <div id="loading" class="loading-state">Loading open tabs...</div>
    <div id="tab-groups-container" class="tab-list"></div>
  </main>

  <!-- Footer Controls (Visible only when tabs or groups are selected) -->
  <div class="footer-controls" id="footer-controls" style="display: none;">
    <!-- Group Action Row (Visible when tabs or groups are selected) -->
    <div class="group-action-row" id="group-action-row" style="display: none;">
      <button class="cta-btn accent-btn" id="btn-create-group" title="Create a new tab group from selected tabs" style="display: none;">
        <span class="cta-icon">🗂</span> <span id="create-group-btn-text">New Group</span>
      </button>
      <button class="cta-btn warning-btn" id="btn-ungroup" title="Ungroup selected tab group(s)" style="display: none;">
        <span class="cta-icon">⎘</span> <span id="ungroup-btn-text">Ungroup</span>
      </button>
      <button class="cta-btn danger" id="btn-delete-tabs" title="Close selected tabs in browser" style="display: none;">
        <span class="cta-icon">🗑</span> <span id="delete-tabs-btn-text">Delete</span>
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" style="display:none;"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="backend-status">
      <span id="backend-dot" class="backend-dot"></span>
      <span id="backend-status-text">Backend: Checking...</span>
    </div>
    <span>v0.1.0</span>
  </div>

  <!-- Closed Windows History Modal -->
  <div id="win-history-modal" class="win-modal-overlay" style="display: none;">
    <div class="win-modal-card">
      <div class="win-modal-header">
        <div class="win-modal-title">
          <span>🪟</span>
          <span>Recently Closed Windows</span>
        </div>
        <span class="close-x" id="win-history-close" title="Close">✕</span>
      </div>
      <div class="win-modal-body" id="win-history-list">
        <!-- Injected via popup.ts -->
      </div>
    </div>
  </div>

  <!-- Group Creation / Save Modal -->
  <div id="group-modal" class="win-modal-overlay" style="display: none;">
    <div class="win-modal-card group-modal-card">
      <div class="win-modal-header">
        <div class="win-modal-title">
          <span id="group-modal-icon">🗂</span>
          <span id="group-modal-title">Group Tabs</span>
        </div>
        <span class="close-x" id="group-modal-close" title="Close">✕</span>
      </div>
      <div class="win-modal-body group-modal-body">
        <label class="modal-label" for="group-name-input">Group Name</label>
        <input type="text" id="group-name-input" class="export-title-input" placeholder="e.g. YouTube Videos, Research" autocomplete="off" />

        <label class="modal-label">Color</label>
        <div class="color-picker-row" id="group-color-picker">
          <div class="color-swatch" data-color="blue" style="background: #8ab4f8;" title="Blue"></div>
          <div class="color-swatch" data-color="orange" style="background: #fcad70;" title="Orange"></div>
          <div class="color-swatch" data-color="green" style="background: #81c995;" title="Green"></div>
          <div class="color-swatch" data-color="red" style="background: #f28b82;" title="Red"></div>
          <div class="color-swatch" data-color="cyan" style="background: #78d9ec;" title="Cyan"></div>
          <div class="color-swatch" data-color="purple" style="background: #c58af9;" title="Purple"></div>
          <div class="color-swatch" data-color="yellow" style="background: #fdd663;" title="Yellow"></div>
          <div class="color-swatch" data-color="pink" style="background: #ff8bcb;" title="Pink"></div>
          <div class="color-swatch" data-color="grey" style="background: #dadce0;" title="Grey"></div>
        </div>

        <div id="group-save-close-row" class="modal-checkbox-row" style="display: none;">
          <label class="checkbox-container">
            <input type="checkbox" id="group-close-tabs-checkbox" />
            <span class="checkbox-label">Close tabs in browser after saving</span>
          </label>
        </div>

        <div class="modal-actions-row">
          <button class="cta-btn secondary" id="btn-group-modal-cancel">Cancel</button>
          <button class="cta-btn primary" id="btn-group-modal-confirm">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
